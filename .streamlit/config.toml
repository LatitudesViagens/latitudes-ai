[theme]
primaryColor = "#94825D"
backgroundColor = "#F6F4F0"
secondaryBackgroundColor = "#F2EFE6"
textColor = "#333333"
font = "sans-serif"

[client]
toolbarMode = "minimal"
[server]
enableStaticServing = true
# Produção: sem vigiar arquivos (gasta CPU no servidor) e com as telas
# comprimidas no caminho até o navegador (CSS e textos repetidos a cada clique).
fileWatcherType = "none"
runOnSave = false
enableWebsocketCompression = true

[browser]
gatherUsageStats = false
